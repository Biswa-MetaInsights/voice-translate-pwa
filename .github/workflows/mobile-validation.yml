name: Mobile validation (manual, no deployment)
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'lib/mobile/**'
      - 'api/mobile/**'
      - '.github/workflows/mobile-validation.yml'
  workflow_dispatch:
    inputs:
      backend_origin:
        description: Separate HTTPS mobile test backend (public URL only)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mobile-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MOBILE_BACKEND_ORIGIN: ${{ inputs.backend_origin || 'https://mobile-test.voicetranslator.eu' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - run: node mobile/scripts/install-shared.mjs
      - name: Install audio decoder verification tools
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: npm test && npm run build
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile
      - run: npm test && npm run build && npm run sync
        working-directory: mobile
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:bundleRelease
        working-directory: mobile/android
        env:
          MOBILE_UNSIGNED_VALIDATION: 'true'
      - name: Grant this ephemeral runner access to its KVM device
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          working-directory: mobile/android
          script: bash ../scripts/run-android-simulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation-not-for-store
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/
          retention-days: 7
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MOBILE_BACKEND_ORIGIN: ${{ inputs.backend_origin || 'https://mobile-test.voicetranslator.eu' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: xcodebuild -version
      - run: node mobile/scripts/install-shared.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile
      - run: npm test && npm run build && npm run sync
        working-directory: mobile
      - run: xcodebuild -project App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios
