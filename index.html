<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#0f172a"/><link rel="manifest" href="/manifest.webmanifest"/><title>Voice Translate</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#e0f2fe 0,#f8fafc 38%,#fff 100%)}button,select{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh;padding:24px 18px 36px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:14px;background:#0f172a;color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 10px 30px rgba(15,23,42,.18)}h1{font-size:1.4rem;margin:0}.sub{margin:3px 0 0;color:#64748b;font-size:.92rem}.card{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid #e2e8f0;border-radius:24px;padding:18px;box-shadow:0 18px 50px rgba(15,23,42,.08)}.langs{display:grid;grid-template-columns:1fr 48px 1fr;gap:10px;align-items:end}.label{font-size:.78rem;color:#64748b;margin-bottom:7px;font-weight:700}select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:14px;background:#fff}.swap{height:46px;border:0;border-radius:14px;background:#eef2ff;font-size:20px;cursor:pointer}.micWrap{text-align:center;padding:34px 0 28px}.mic{width:108px;height:108px;border-radius:50%;border:0;background:#0f172a;color:#fff;font-size:42px;cursor:pointer;box-shadow:0 16px 40px rgba(15,23,42,.28);transition:.2s}.mic.listening{background:#dc2626;transform:scale(1.04);box-shadow:0 0 0 12px rgba(220,38,38,.12),0 16px 40px rgba(220,38,38,.25)}.status{margin-top:14px;color:#475569;font-size:.92rem}.panel{border-top:1px solid #e2e8f0;padding-top:18px;margin-top:4px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.05em}.textBox{min-height:92px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-top:8px;line-height:1.55;color:#0f172a;white-space:pre-wrap}.placeholder{color:#94a3b8}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:14px;padding:12px 9px;font-weight:700;cursor:pointer}.btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.hint{text-align:center;color:#94a3b8;font-size:.8rem;margin-top:18px}@media(max-width:520px){.app{padding:18px 14px 28px}.card{border-radius:20px}.langs{grid-template-columns:1fr 44px 1fr}.actions{grid-template-columns:1fr 1fr}.btn:last-child{grid-column:1/-1}}</style></head><body><main class="app"><div class="brand"><div class="logo">🎙️</div><div><h1>Voice Translate</h1><p class="sub">Speak naturally. Read or hear the translation.</p></div></div><section class="card"><div class="langs"><div><div class="label">INPUT</div><select id="inputLang"><option value="en-US">English</option><option value="nl-NL">Dutch</option><option value="fr-FR">French</option><option value="de-DE">German</option><option value="es-ES">Spanish</option><option value="it-IT">Italian</option><option value="hi-IN">Hindi</option><option value="ml-IN">Malayalam</option><option value="ta-IN">Tamil</option></select></div><button class="swap" id="swap" aria-label="Swap languages">⇄</button><div><div class="label">OUTPUT</div><select id="outputLang"><option value="fr-FR">French</option><option value="en-US">English</option><option value="nl-NL">Dutch</option><option value="de-DE">German</option><option value="es-ES">Spanish</option><option value="it-IT">Italian</option><option value="hi-IN">Hindi</option><option value="ml-IN">Malayalam</option><option value="ta-IN">Tamil</option></select></div></div><div class="micWrap"><button class="mic" id="mic" aria-label="Start speaking">🎤</button><div class="status" id="status">Tap the microphone and start speaking</div></div><div class="panel"><div class="sectionTitle">Transcription</div><div class="textBox placeholder" id="transcript">Your speech will appear here.</div></div><div class="panel"><div class="sectionTitle">Translation</div><div class="textBox placeholder" id="translation">Your translation will appear here.</div><div class="actions"><button class="btn" id="copy">Copy</button><button class="btn primary" id="speak">🔊 Speak</button><button class="btn" id="clear">Clear</button></div></div></section><div class="hint">Prototype • installable PWA • no sign-in</div></main><script>const mic=document.getElementById('mic'),statusEl=document.getElementById('status'),transcriptEl=document.getElementById('transcript'),translationEl=document.getElementById('translation'),input=document.getElementById('inputLang'),output=document.getElementById('outputLang');let recognition;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{mic.classList.add('listening');statusEl.textContent='Listening… tap again to stop'};recognition.onend=()=>{mic.classList.remove('listening');statusEl.textContent='Tap the microphone and start speaking'};recognition.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;e.results[i].isFinal?final+=t:interim+=t}transcriptEl.classList.remove('placeholder');transcriptEl.textContent=final||interim;if(final){translationEl.classList.remove('placeholder');translationEl.textContent='Prototype translation: '+final;}};recognition.onerror=e=>{statusEl.textContent='Microphone error: '+e.error;mic.classList.remove('listening')}}else statusEl.textContent='Speech recognition is not supported in this browser.';mic.onclick=()=>{if(!recognition)return;recognition.lang=input.value;try{recognition.start()}catch{recognition.stop()}};document.getElementById('swap').onclick=()=>{const a=input.value;input.value=output.value;output.value=a};document.getElementById('clear').onclick=()=>{transcriptEl.textContent='Your speech will appear here.';translationEl.textContent='Your translation will appear here.';transcriptEl.className='textBox placeholder';translationEl.className='textBox placeholder'};document.getElementById('copy').onclick=async()=>{const t=translationEl.textContent;if(!translationEl.classList.contains('placeholder')){await navigator.clipboard.writeText(t);statusEl.textContent='Translation copied'}};document.getElementById('speak').onclick=()=>{if(translationEl.classList.contains('placeholder'))return;const u=new SpeechSynthesisUtterance(translationEl.textContent.replace('Prototype translation: ',''));u.lang=output.value;speechSynthesis.cancel();speechSynthesis.speak(u)};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
